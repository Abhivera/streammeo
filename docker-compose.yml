services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    working_dir: /repo
    command: ["npm", "run", "-w", "@streammeo/backend", "start"]
    ports:
      - "3001:3001"
    volumes:
      - streammeo-sqlite:/repo/data
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-docker-change-me-in-docker}
      SQLITE_PATH: ${SQLITE_PATH:-/repo/data/streammeo.db}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-nova-2}
      DEEPGRAM_TTS_MODEL: ${DEEPGRAM_TTS_MODEL:-aura-2-thalia-en}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  streammeo-sqlite:
