services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - streammeo-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    working_dir: /repo
    command: ["npm", "run", "-w", "@streammeo/backend", "start"]
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/streammeo}
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-docker-change-me-in-docker}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      DEEPGRAM_STT_MODEL: ${DEEPGRAM_STT_MODEL:-nova-2}
      DEEPGRAM_TTS_MODEL: ${DEEPGRAM_TTS_MODEL:-aura-2-thalia-en}
      GROQ_API_KEY: ${GROQ_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  streammeo-mongo:
