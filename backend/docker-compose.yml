services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "tsx", "src/index.ts"]
    ports:
      - "3001:3001"
    # Shared root .env (the only thing backend and frontend share).
    env_file:
      - ../.env
    environment:
      PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      WIDGET_ALLOWED_ORIGINS: ${WIDGET_ALLOWED_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-docker-change-me-in-docker}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-apac.anthropic.claude-3-5-sonnet-20240620-v1:0}
      TRANSCRIBE_LANGUAGE_CODE: ${TRANSCRIBE_LANGUAGE_CODE:-en-US}
      POLLY_VOICE_ID: ${POLLY_VOICE_ID:-Joanna}
      POLLY_ENGINE: ${POLLY_ENGINE:-neural}
      AUDIO_BUCKET: ${AUDIO_BUCKET}
      DYNAMODB_USERS_TABLE: ${DYNAMODB_USERS_TABLE:-streammeo-users}
      DYNAMODB_WORKSPACES_TABLE: ${DYNAMODB_WORKSPACES_TABLE:-streammeo-workspaces}
      DYNAMODB_SESSIONS_TABLE: ${DYNAMODB_SESSIONS_TABLE:-streammeo-sessions}
      DYNAMODB_MESSAGES_TABLE: ${DYNAMODB_MESSAGES_TABLE:-streammeo-messages}
      DYNAMODB_TOOL_CALLS_TABLE: ${DYNAMODB_TOOL_CALLS_TABLE:-streammeo-tool-calls}
      DYNAMODB_FAQS_TABLE: ${DYNAMODB_FAQS_TABLE:-streammeo-faqs}
      APPSYNC_GRAPHQL_URL: ${APPSYNC_GRAPHQL_URL}
      APPSYNC_API_KEY: ${APPSYNC_API_KEY}
