type TicketEvent {
  workspaceId: ID!
  ticketId: ID!
  eventType: String!
  payload: AWSJSON
  createdAt: AWSDateTime!
}

type BillingEvent {
  workspaceId: ID!
  plan: String!
  eventType: String!
  createdAt: AWSDateTime!
}

type EmailStatusEvent {
  workspaceId: ID!
  ticketId: ID
  status: String!
  payload: AWSJSON
  createdAt: AWSDateTime!
}

type Mutation {
  publishTicketEvent(
    workspaceId: ID!
    ticketId: ID!
    eventType: String!
    payload: AWSJSON
  ): TicketEvent
  publishBillingEvent(workspaceId: ID!, plan: String!, eventType: String!): BillingEvent
  publishEmailStatus(
    workspaceId: ID!
    ticketId: ID
    status: String!
    payload: AWSJSON
  ): EmailStatusEvent
}

type Subscription {
  onTicketEvent(workspaceId: ID!): TicketEvent
    @aws_subscribe(mutations: ["publishTicketEvent"])
  onBillingEvent(workspaceId: ID!): BillingEvent
    @aws_subscribe(mutations: ["publishBillingEvent"])
  onEmailStatus(workspaceId: ID!): EmailStatusEvent
    @aws_subscribe(mutations: ["publishEmailStatus"])
}

type Query {
  health: String!
}

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}
